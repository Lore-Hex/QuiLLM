[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quillm-research"
version = "1.0.0"
description = "An auditable Qwen3 political-censorship reduction experiment"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
train = [
  "heretic-llm==1.3.0", "torch==2.12.0", "transformers==5.8.1",
  "peft==0.19.1", "accelerate==1.13.0", "datasets==4.8.5",
  "huggingface-hub==1.15.0", "safetensors==0.7.0", "optuna==4.8.0",
  "tokenizers==0.22.2",
]

[tool.setuptools]
packages = []
