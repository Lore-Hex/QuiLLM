name: Research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/summarize.py --check
      - run: python scripts/report_freedombench.py --check
      - run: python -m compileall -q scripts
      - run: bash -n scripts/rebuild.sh scripts/run_heretic.sh scripts/convert_to_gguf.sh
